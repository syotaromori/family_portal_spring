spring.application.name=family_portal

spring.datasource.url=jdbc:mysql://localhost:3306/family_portal
spring.datasource.username=django_user
spring.datasource.password=syotaro1983

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.url=jdbc:mysql://localhost:3306/family_portal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo

# 予定のメール通知(Gmail SMTP)
# 認証情報はGoogleアカウントの「アプリパスワード」を環境変数で渡す(ここには書かない)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# 通知の宛先(空ならメール通知は無効)と、前日リマインドを送る時刻(時)
app.notification.to=${NOTIFICATION_TO:}
# 差出人として表示する名前
app.notification.from-name=family_portal
app.notification.reminder-hour=18

# 成長記録の写真・動画の保存先とアップロードサイズ上限
# iPhoneの動画は4K/60fpsだと1分あたり数百MBになるため、1GBまで許可する
app.upload-dir=uploads/growth-images
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# 動画はアップロード時にffmpegでH.264(MP4)へ変換する
# (iPhoneのHEVC動画をWindowsのブラウザでも再生できるようにするため)
# ffmpegが見つからない・変換に失敗した場合は、元の動画のまま保存する
# PATHに通っていない場合はフルパスを指定する(例: C:/Tools/ffmpeg/bin/ffmpeg.exe)
app.ffmpeg.path=ffmpeg
# 変換のタイムアウト。Djangoのアップロード待ち時間(600秒)より短くすること
app.ffmpeg.timeout-minutes=8
